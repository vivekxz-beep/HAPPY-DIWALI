
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivek - Happy Diwali</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        180deg,
        #03031c,
        #100b38 40%,
        #482044 75%,
        #e87527
    );
}

/* STARS */
.stars {
    position: fixed;
    inset: 0;
    background-image:
    radial-gradient(2px 2px at 10% 15%, white, transparent),
    radial-gradient(2px 2px at 30% 35%, white, transparent),
    radial-gradient(2px 2px at 70% 20%, white, transparent),
    radial-gradient(2px 2px at 90% 45%, white, transparent),
    radial-gradient(2px 2px at 50% 10%, white, transparent);
    background-size: 160px 160px;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .3; }
    to { opacity: 1; }
}

/* MOON */
.moon {
    position: absolute;
    top: 7%;
    right: 9%;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #fff1bd;
    box-shadow: 0 0 40px #ffe5a0, 0 0 100px #ffcb60;
    animation: moonGlow 3s infinite alternate;
}

@keyframes moonGlow {
    to {
        box-shadow: 0 0 65px #ffe5a0, 0 0 130px #ffcb60;
    }
}

/* LANTERNS */
.lanterns {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.lantern {
    position: absolute;
    bottom: -130px;
    left: var(--x);
    width: var(--w);
    height: calc(var(--w) * 1.35);
    border: 3px solid #a84905;
    border-radius: 25% 25% 12% 12%;
    background: radial-gradient(
        ellipse,
        #fff4b1,
        #ffd15a 40%,
        #ff8c13 75%,
        #b74700
    );
    box-shadow: 0 0 20px #ff9b22, 0 0 45px #ff8c0a;
    animation: rise var(--speed) linear var(--delay) infinite,
               swing var(--swing) ease-in-out infinite alternate;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10%, 90% { opacity: 1; }
    100% { transform: translateY(-125vh); opacity: 0; }
}

@keyframes swing {
    from { margin-left: -12px; rotate: -4deg; }
    to { margin-left: 12px; rotate: 4deg; }
}

/* GREETING */
.message {
    position: absolute;
    top: 31%;
    width: 100%;
    padding: 12px;
    text-align: center;
    z-index: 5;
    animation: appear 2s ease-out both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px) scale(.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.from {
    font-family: Arial, sans-serif;
    font-size: clamp(15px, 4vw, 23px);
    letter-spacing: 4px;
    font-weight: bold;
    color: #fff1bd;
    text-shadow: 0 0 15px #ffb52c;
    margin-bottom: 15px;
}

.message p {
    color: #fff3ce;
    font-size: clamp(18px, 5vw, 27px);
    line-height: 1.4;
    text-shadow: 0 2px 10px #ffb52c;
}

.message h1 {
    margin-top: 8px;
    font-size: clamp(48px, 13vw, 85px);
    font-style: italic;
    font-weight: 900;
    line-height: 1.05;
    background: linear-gradient(#fffbd8, #ffd64e 45%, #ff8700);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 5px 4px #572000)
            drop-shadow(0 0 20px #ffb52c);
    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    to {
        filter: drop-shadow(0 5px 4px #572000)
                drop-shadow(0 0 40px #ffd34d);
    }
}

.heart {
    color: #ffdc8a;
    font-size: 25px;
    margin-top: 10px;
    animation: heartbeat 1s infinite alternate;
}

@keyframes heartbeat {
    to { transform: scale(1.2); }
}

/* DIYAS */
.diyas {
    position: absolute;
    bottom: 6%;
    width: 100%;
    display: flex;
    justify-content: space-around;
    z-index: 4;
}

.diya {
    position: relative;
    width: 55px;
    height: 27px;
    border-radius: 10px 10px 50% 50%;
    background: linear-gradient(#ffd16a, #a84909);
    box-shadow: 0 0 25px #ffad32;
}

.diya::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 65%;
    width: 16px;
    height: 38px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: linear-gradient(white, #fff1a0 40%, #ff8b10);
    box-shadow: 0 0 25px #ffd45a;
    animation: flame .3s infinite alternate;
}

@keyframes flame {
    from { transform: translateX(-50%) scale(.9) skewX(-6deg); }
    to { transform: translateX(-50%) scale(1.1) skewX(6deg); }
}

/* FIREWORK AREA */
#effects {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
}

.rocket {
    position: absolute;
    bottom: -50px;
    width: 9px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(white, orange, red);
    box-shadow: 0 0 12px orange, 0 0 25px yellow;
    animation: rocketUp 1.4s ease-out forwards;
}

@keyframes rocketUp {
    to {
        transform: translateY(var(--travel));
        opacity: 0;
    }
}

.firework {
    position: absolute;
    width: 5px;
    height: 5px;
}

.spark {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color);
    box-shadow: 0 0 12px 3px var(--color);
    animation: explode 1.1s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: rotate(var(--angle)) translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: rotate(var(--angle)) translateY(var(--distance)) scale(0);
        opacity: 0;
    }
}

/* ANAR */
.anar {
    position: absolute;
    bottom: 10%;
    left: var(--left);
    width: 28px;
    height: 45px;
    border-radius: 50% 50% 10px 10px;
    background: linear-gradient(#ffd45a, #b54b08);
    box-shadow: 0 0 20px orange;
}

.anar::before {
    content: "✦";
    position: absolute;
    bottom: 100%;
    left: -10px;
    color: #fff5a0;
    font-size: 45px;
    text-shadow: 0 0 15px orange, 0 0 30px yellow;
    animation: fountain .3s infinite alternate;
}

@keyframes fountain {
    from { transform: scale(.8) rotate(-10deg); }
    to { transform: scale(1.3) rotate(10deg); }
}

/* CHAKRI */
.chakri {
    position: absolute;
    bottom: 9%;
    left: var(--left);
    font-size: 35px;
    filter: drop-shadow(0 0 12px orange);
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* FALLING SPARKS */
.confetti {
    position: absolute;
    top: -20px;
    left: var(--left);
    color: var(--color);
    font-size: 20px;
    animation: fall var(--speed) linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* FOOTER */
.footer {
    position: absolute;
    bottom: 1%;
    width: 100%;
    text-align: center;
    z-index: 6;
    color: #fff0c4;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="moon"></div>

<!-- LANTERNS -->
<div class="lanterns">

<div class="lantern" style="--x:3%;--w:50px;--speed:15s;--delay:-2s;--swing:3s"></div>
<div class="lantern" style="--x:15%;--w:65px;--speed:19s;--delay:-8s;--swing:4s"></div>
<div class="lantern" style="--x:28%;--w:45px;--speed:14s;--delay:-5s;--swing:3s"></div>
<div class="lantern" style="--x:40%;--w:70px;--speed:20s;--delay:-12s;--swing:5s"></div>
<div class="lantern" style="--x:55%;--w:55px;--speed:17s;--delay:-6s;--swing:4s"></div>
<div class="lantern" style="--x:68%;--w:65px;--speed:18s;--delay:-10s;--swing:3s"></div>
<div class="lantern" style="--x:83%;--w:55px;--speed:16s;--delay:-4s;--swing:4s"></div>
<div class="lantern" style="--x:94%;--w:45px;--speed:21s;--delay:-14s;--swing:5s"></div>
<div class="lantern" style="--x:8%;--w:40px;--speed:18s;--delay:-11s;--swing:4s"></div>
<div class="lantern" style="--x:48%;--w:45px;--speed:15s;--delay:-9s;--swing:3s"></div>
<div class="lantern" style="--x:75%;--w:50px;--speed:20s;--delay:-13s;--swing:5s"></div>

</div>

<!-- GREETING -->
<div class="message">
    <div class="from">✨ VIVEK KI TARAF SE ✨</div>

    <p>
        Aapko Aur Aapke<br>
        Poore Parivaar Ko
    </p>

    <h1>Happy<br>Diwali</h1>

    <div class="heart">🪔 ❤️ 🪔</div>
</div>

<!-- DIYAS -->
<div class="diyas">
    <div class="diya"></div>
    <div class="diya"></div>
    <div class="diya"></div>
    <div class="diya"></div>
    <div class="diya"></div>
    <div class="diya"></div>
</div>

<!-- ANAR AND CHAKRI -->
<div class="anar" style="--left:12%"></div>
<div class="anar" style="--left:86%"></div>

<div class="chakri" style="--left:32%">✨</div>
<div class="chakri" style="--left:65%">✨</div>

<div class="footer">WITH LOVE ❤️ FROM VIVEK</div>

<!-- FIREWORKS -->
<div id="effects"></div>

<script>
const effects = document.getElementById("effects");

const colors = [
    "#ff3030",
    "#ffff00",
    "#00ffff",
    "#ff55ff",
    "#ffffff",
    "#ff9900",
    "#00ff66"
];

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

// CREATE FIREWORK
function createFirework(x, y) {
    const burst = document.createElement("div");
    burst.className = "firework";
    burst.style.left = x + "px";
    burst.style.top = y + "px";

    for (let i = 0; i < 32; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";

        spark.style.setProperty("--angle", (i * 360 / 32) + "deg");
        spark.style.setProperty("--distance", (50 + Math.random() * 90) + "px");
        spark.style.setProperty("--color", randomColor());

        burst.appendChild(spark);
    }

    effects.appendChild(burst);

    setTimeout(() => burst.remove(), 1200);
}

// ROCKET LAUNCH
function launchRocket() {
    const rocket = document.createElement("div");
    rocket.className = "rocket";

    const x = 5 + Math.random() * (window.innerWidth - 20);
    const height = 200 + Math.random() * (window.innerHeight * .55);

    rocket.style.left = x + "px";
    rocket.style.setProperty("--travel", -height + "px");

    effects.appendChild(rocket);

    rocket.addEventListener("animationend", () => {
        createFirework(x, Math.max(20, window.innerHeight - height));
        rocket.remove();
    }, { once: true });
}

// SKY FIREWORKS
function randomFirework() {
    const x = 30 + Math.random() * (window.innerWidth - 60);
    const y = 40 + Math.random() * (window.innerHeight * .55);
    createFirework(x, y);
}

// GOLDEN PARTICLES
function createParticle() {
    const particle = document.createElement("div");
    particle.className = "confetti";
    particle.textContent = "✦";

    particle.style.setProperty("--left", Math.random() * 100 + "%");
    particle.style.setProperty("--speed", (3 + Math.random() * 4) + "s");
    particle.style.setProperty("--color", randomColor());

    effects.appendChild(particle);

    setTimeout(() => particle.remove(), 7000);
}

// ANIMATION TIMERS
setInterval(launchRocket, 1400);
setInterval(randomFirework, 1900);
setInterval(createParticle, 350);

// STARTING CELEBRATION
setTimeout(randomFirework, 500);
setTimeout(randomFirework, 1000);
setTimeout(randomFirework, 1500);
</script>

</body>
</html>
